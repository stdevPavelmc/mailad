# repo sources
# I use a local nginx reverse proxy to cache all the files downloaded to speedup the process
# if you want to use the official mirrors, just change the host to archive.ubuntu.com and deb.debian.org and remove the port
repos:
  arch: amd64
  ubuntu:
    host: 192.168.1.102
    port: 80
  debian:
    host: 192.168.1.102
    port: 80

